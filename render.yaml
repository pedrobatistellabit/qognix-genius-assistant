services:
  - type: web
    name: qognix-genius-assistant
    env: python
    region: oregon
    plan: free
    branch: master
    buildCommand: "pip install -r requirements.txt && cd frontend && pnpm install && pnpm run build && cp -r dist/* ../backend/src/static/"
    startCommand: "cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 src.main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://demo.supabase.co
      - key: SUPABASE_ANON_KEY
        value: demo-key
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true

